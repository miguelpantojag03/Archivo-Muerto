<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#1D2733"/>
      <stop offset="55%" stop-color="#141A23"/>
      <stop offset="100%" stop-color="#0D0F14"/>
    </radialGradient>

    <radialGradient id="mist" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#7FB38A" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#7FB38A" stop-opacity="0"/>
    </radialGradient>

    <!-- Semilla: vidrio translúcido en tono tierra-azulado -->
    <linearGradient id="seedBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8FA8BD" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#5D85A8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#425D73" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="specular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Brote: verde salvia vivo -->
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="20%" y2="0%">
      <stop offset="0%" stop-color="#5E8F6C" stop-opacity="1"/>
      <stop offset="100%" stop-color="#9FD3AC" stop-opacity="1"/>
    </linearGradient>

    <radialGradient id="sproutGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8F0D2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7FB38A" stop-opacity="0"/>
    </radialGradient>

    <filter id="contactShadow" x="-40%" y="-20%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#5D85A8" flood-opacity="0.32"/>
    </filter>

    <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="squircleClip">
      <path d="M512,48 C820,48 976,204 976,512 C976,820 820,976 512,976
               C204,976 48,820 48,512 C48,204 204,48 512,48 Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bgGrad)" clip-path="url(#squircleClip)"/>
  <rect width="1024" height="1024" fill="url(#mist)" clip-path="url(#squircleClip)"/>

  <path d="M512,48 C820,48 976,204 976,512 C976,820 820,976 512,976
           C204,976 48,820 48,512 C48,204 204,48 512,48 Z"
        fill="none" stroke="#2E3A48" stroke-width="2"/>

  <!-- Sombra de contacto -->
  <ellipse cx="512" cy="730" rx="150" ry="26" fill="#5D85A8" opacity="0.28" filter="url(#glowSoft)"/>

  <!-- Halo detrás del brote -->
  <ellipse cx="532" cy="410" rx="90" ry="110" fill="url(#sproutGlow)" opacity="0.6" filter="url(#glowSoft)"/>

  <g filter="url(#contactShadow)">
    <!-- Mitad inferior de la semilla (queda cerrada / sigue siendo semilla) -->
    <path d="M392,560
             C392,470 440,420 512,420
             C584,420 632,470 632,560
             C632,636 576,680 512,680
             C448,680 392,636 392,560 Z"
          fill="url(#seedBody)"/>

    <!-- Línea de apertura, sutil, donde la semilla se abre -->
    <path d="M420,470 C460,430 564,430 604,470"
          fill="none" stroke="#2E3A48" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

    <!-- Brillo especular -->
    <ellipse cx="458" cy="500" rx="40" ry="70" fill="url(#specular)" transform="rotate(-18 458 500)"/>

    <!-- Contorno de la semilla -->
    <path d="M392,560 C392,470 440,420 512,420 C584,420 632,470 632,560
             C632,636 576,680 512,680 C448,680 392,636 392,560 Z"
          fill="none" stroke="#C9DAE8" stroke-width="2" stroke-opacity="0.35"/>

    <!-- Brote emergiendo desde arriba de la semilla, curvándose con vida -->
    <path d="M512,440
             C508,392 522,350 516,308
             C512,284 524,262 548,250"
          fill="none" stroke="url(#sproutGrad)" stroke-width="14" stroke-linecap="round"/>

    <!-- Hoja pequeña del brote -->
    <path d="M516,320 C546,308 568,318 578,342 C552,348 528,342 516,320 Z"
          fill="url(#sproutGrad)"/>
    <path d="M548,264 C572,246 598,250 610,270 C588,284 562,282 548,264 Z"
          fill="url(#sproutGrad)" opacity="0.92"/>

    <!-- Punta brillante del brote -->
    <circle cx="549" cy="249" r="8" fill="#E8FAEC" filter="url(#glowSoft)"/>
  </g>

  <!-- Partículas de polen/luz alrededor -->
  <g opacity="0.65">
    <circle cx="660" cy="360" r="3.4" fill="#C8F0D2"/>
    <circle cx="630" cy="300" r="2.6" fill="#9FC2DE"/>
    <circle cx="372" cy="420" r="2.8" fill="#9FC2DE"/>
  </g>
</svg>
