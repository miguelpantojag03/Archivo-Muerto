name = "vestigio-ai-proxy"
main = "src/index.js"
compatibility_date = "2026-10-09"

# Cloudflare Workers AI — free tier (10,000 Neurons/day, resets daily),
# runs in-account, no separate API key to protect.
[ai]
binding = "AI"

# APP_SHARED_SECRET is set via `wrangler secret put APP_SHARED_SECRET`
# after deploying — never stored here, never committed.
